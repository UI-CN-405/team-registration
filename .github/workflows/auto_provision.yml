name: Auto Provision Student Team & Repo

on:
  issues:
    types: [opened]

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
      ORG_NAME: "UI-CN-405"
      TEMPLATE_REPO: "project-template"
      TA_TEAM_SLUG: "tas"
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - name: Provision Team and Repo
        run: |
          python3 - << 'EOF'
          import os, re, subprocess, time, sys

          body = os.environ["ISSUE_BODY"]
          org = os.environ["ORG_NAME"]
          template = os.environ["TEMPLATE_REPO"]
          ta_team = os.environ["TA_TEAM_SLUG"]
          issue_num = os.environ["ISSUE_NUMBER"]
          author = os.environ["ISSUE_AUTHOR"]

          def comment_and_close(msg, state="closed"):
              subprocess.run(["gh", "issue", "comment", issue_num, "--repo", os.environ["GITHUB_REPOSITORY"], "--body", msg])
              if state == "closed":
                  subprocess.run(["gh", "issue", "close", issue_num, "--repo", os.environ["GITHUB_REPOSITORY"]])

          # استخراج ساده‌تر نام تیم و اعضا با پایتون
          team_match = re.search(r"Team Name[:\s]*([a-z0-9\-]+)", body, re.IGNORECASE)
          members_match = re.search(r"Team Members.*?\n+\s*([^\n\r]+)", body, re.DOTALL | re.IGNORECASE)

          if not team_match:
              comment_and_close("❌ خطا: نام تیم پیدا نشد. لطفاً در متن ایشو کلمه Team Name را بنویسید.")
              sys.exit(1)

          team_slug = team_match.group(1).strip().lower()
          repo_name = f"project-{team_slug}"

          raw_members = [author]
          if members_match:
              members_str = members_match.group(1)
              extracted = [u.strip().lstrip("@") for u in members_str.split(",") if u.strip()]
              for m in extracted:
                  if m not in raw_members:
                      raw_members.append(m)

          # ۱. ساخت تیم
          subprocess.run(["gh", "api", "--method", "POST", f"/orgs/{org}/teams", "-f", f"name={team_slug}", "-f", "privacy=secret"])

          # ۲. افزودن اعضا
          invited = []
          for user in raw_members:
              r = subprocess.run(["gh", "api", "--method", "PUT", f"/orgs/{org}/teams/{team_slug}/memberships/{user}", "-f", "role=member"], capture_output=True)
              if r.returncode == 0:
                  invited.append(f"@{user}")

          # ۳. ساخت مخزن از Template
          subprocess.run(["gh", "repo", "create", f"{org}/{repo_name}", "--private", "--template", f"{org}/{template}"], check=True)
          time.sleep(3)

          # ۴. تنظیم دسترسی‌ها
          subprocess.run(["gh", "api", "--method", "PUT", f"/orgs/{org}/teams/{team_slug}/repos/{org}/{repo_name}", "-f", "permission=push"])
          subprocess.run(["gh", "api", "--method", "PUT", f"/orgs/{org}/teams/{ta_team}/repos/{org}/{repo_name}", "-f", "permission=maintain"])

          users_str = " ".join(invited)
          msg = f"### ✅ مخزن گروه ساخته شد!\n\n🔗 لینک: https://github.com/{org}/{repo_name}"
          comment_and_close(msg)
          EOF
