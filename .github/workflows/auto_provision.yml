name: Auto Provision Student Team & Repo

on:
  issues:
    types: [opened]

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Create Team and Repo Safe Mode
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG_NAME: "UI-CN-405"
          TEMPLATE_REPO: "project-template"
          TA_TEAM_SLUG: "tas"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e  # جلوگیری از متوقف شدن اکشن در صورت بروز خطا
          
          TEAM_SLUG=$(echo "$ISSUE_TITLE" | sed 's/.*: *//' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-_')
          if [ -z "$TEAM_SLUG" ] || [ "$TEAM_SLUG" = "team" ]; then
            TEAM_SLUG="group-$ISSUE_NUMBER"
          fi
          
          REPO_NAME="project-$TEAM_SLUG"
          echo "Target Team: $TEAM_SLUG, Repo: $REPO_NAME"

          # ۱. ساخت تیم
          gh api --method POST "/orgs/$ORG_NAME/teams" -f name="$TEAM_SLUG" -f privacy="secret"

          # ۲. افزودن کاربر
          gh api --method PUT "/orgs/$ORG_NAME/teams/$TEAM_SLUG/memberships/$ISSUE_AUTHOR" -f role="member"

          # ۳. ساخت مخزن از روی Template
          gh repo create "$ORG_NAME/$REPO_NAME" --private --template "$ORG_NAME/$TEMPLATE_REPO"
          sleep 3

          # ۴. تنظیم دسترسی‌ها
          gh api --method PUT "/orgs/$ORG_NAME/teams/$TEAM_SLUG/repos/$ORG_NAME/$REPO_NAME" -f permission="push"
          gh api --method PUT "/orgs/$ORG_NAME/teams/$TA_TEAM_SLUG/repos/$ORG_NAME/$REPO_NAME" -f permission="maintain"

          # ۵. کامنت و بستن ایشو
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "### ✅ مخزن گروه با موفقیت ساخته شد!

          🔗 **لینک مخزن خصوصی شما:** https://github.com/$ORG_NAME/$REPO_NAME"

          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          exit 0
