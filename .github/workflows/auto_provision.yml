name: Auto Provision Team Repository

on:
  issues:
    types: [opened, edited]

jobs:
  provision:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, '[Team Registration]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GitHub CLI
        run: |
          echo "${{ secrets.ORG_ADMIN_TOKEN }}" | gh auth login --with-token

      - name: Parse Issue Body & Extract Team Info
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # استخراج نام گروه (Team Name)
          TEAM_NAME=$(echo "$ISSUE_BODY" | grep -i "Team Name" | head -n 1 | sed 's/.*: *//' | tr -d '\r' | xargs)
          if [ -z "$TEAM_NAME" ]; then
            TEAM_NAME="team-$(date +%s)"
          fi
          # تبدیل به حروف کوچک و جایگزینی فاصله‌ها با خط تیره
          REPO_NAME="project-$(echo "$TEAM_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')"
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

          # استخراج نام‌های کاربری گیت‌هاب از متن ایشو
          # فرض بر این است که نام‌های کاربری جلوی عبارت‌های مثل Lead یا Member یا خط تیره (-) قرار دارند
          USERS=$(echo "$ISSUE_BODY" | grep -iE "(Lead|عضو|مخاطب|-)" | sed 's/.*: *//' | tr -d '\r' | xargs)
          echo "usernames=$USERS" >> $GITHUB_OUTPUT

      - name: Create Repository from Template
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
        run: |
          ORG="UI-CN-405"
          TEMPLATE="project-template"
          
          # بررسی اینکه آیا مخزن از قبل وجود دارد یا خیر
          if gh repo view "$ORG/$REPO_NAME" &>/dev/null; then
            echo "Repository $ORG/$REPO_NAME already exists."
          else
            # ساخت مخزن خصوصی از روی قالب
            gh repo create "$ORG/$REPO_NAME" --private --template="$ORG/$TEMPLATE"
            echo "Repository $ORG/$REPO_NAME created successfully from template."
          fi

      - name: Add Collaborators to Repository
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          USERNAMES: ${{ steps.parse.outputs.usernames }}
        run: |
          ORG="UI-CN-405"
          
          # جداسازی نام‌های کاربری و اضافه کردن به عنوان همکار
          for user in $USERNAMES; do
            # رد کردن کلمات کلیدی احتمالی
            if [ "$user" = "-" ] || [ -z "$user" ]; then
              continue
            fi
            
            echo "Adding $user as collaborator to $ORG/$REPO_NAME..."
            gh api -X PUT /repos/$ORG/$REPO_NAME/collaborators/$user -f permission='push' || echo "Failed to add $user"
          done

      - name: Comment on Issue and Close
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          ORG="UI-CN-405"
          REPO_URL="https://github.com/$ORG/$REPO_NAME"
          
          COMMENT="🎉 گروه گرامی، مخزن اختصاصی شما با موفقیت ساخته شد و اعضای ذکرشده به عنوان همکار اضافه شدند!\n\n🔗 لینک مخزن شما: $REPO_URL"
          
          gh issue comment $ISSUE_NUMBER --body "$COMMENT"
          gh issue close $ISSUE_NUMBER
